services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ocr_gov}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Host side is configurable for machines that already run Postgres on
      # 5432 (set POSTGRES_HOST_PORT in .env); the backend uses db:5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD:-ocr_pass}@db:5432/${POSTGRES_DB:-ocr_gov}
      HF_HOME: /data/huggingface
      # Must be the uploads_data volume below; .env's UPLOAD_DIR is for running
      # the backend outside Docker and would put uploads in the container's
      # own filesystem, losing them on every rebuild.
      UPLOAD_DIR: /data/uploads
    depends_on:
      - db
    volumes:
      - uploads_data:/data/uploads
      - models_cache:/data/huggingface
      - ./backend/models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
  uploads_data:
  models_cache:
